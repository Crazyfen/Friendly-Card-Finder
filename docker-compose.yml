services:
  bot:
    image: ghcr.io/crazyfen/friendlycardfinder:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env
    # Deliberately no ports: the Admin Panel listens on :8081 inside the compose
    # network and is reachable only through caddy, so there is no route that
    # bypasses TLS and Basic Auth. See docs/adr/0003.

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    env_file: .env
    # The host's nginx owns :80 and xray owns :443. Port 80 is reached only
    # through nginx, which forwards admin.ivash.net's ACME HTTP-01 challenge
    # here; the panel itself is served on :8443.
    ports:
      - "127.0.0.1:8088:80"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  # Named so the issued certificate survives a redeploy; losing it means
  # re-requesting from Let's Encrypt on every restart.
  caddy_data:
  caddy_config:
